# ClaimWise configuration — single source of truth for all runtime settings.
# Never hardcode paths, model names, or thresholds in scripts (CLAUDE.md §8).
# Secrets live in .env, never here.

project:
  name: claimwise
  seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  eval_dir: data/eval
  logs_dir: logs

ingest:
  # "text"   = plain reading-order extraction (Phase 1 baseline)
  # "blocks" = positioned blocks sorted top-to-bottom, left-to-right
  # Phase 2 flips this and re-evaluates so the delta is attributable.
  extraction_mode: text

  # Pages with fewer characters than this after cleaning are dropped as
  # blank/cover/divider pages. They add noise to the index and never answer
  # a question. Skipped pages are logged, never dropped silently.
  min_chars_per_page: 40

  # Repeated header/footer removal. Policy PDFs stamp the insurer name, UIN,
  # and "Page 12 of 88" on every page; left in, that boilerplate dominates the
  # embedding of every short chunk and flattens retrieval.
  strip_repeated_lines: true
  # A line must appear on this fraction of pages to count as boilerplate.
  repeated_line_threshold: 0.6
  # Only the first/last N lines of a page are candidates — body text that
  # happens to repeat is left alone.
  repeated_line_edge_lines: 3

  # Rejoin words split across a line break ("hospi-\ntalisation").
  dehyphenate: true
  # NFKC normalisation: collapses ligatures and exotic spaces so that a query
  # embedding and a chunk embedding see the same characters.
  normalize_unicode: true
  # Repair f-ligatures that some font subsets decode into Latin Extended-A
  # letters ("beneĤt" -> "benefit", "ĥoater" -> "floater"). NFKC cannot catch
  # these because the wrong characters are themselves valid Unicode. Both SBI
  # documents in this corpus need it on every page.
  repair_ligatures: true

  output_filename: pages.jsonl

chunk:
  # Recursive splitting: try paragraph, then line, then word, then raw
  # character — so a break lands on a real boundary whenever one exists inside
  # the size budget, instead of slicing mid-sentence.
  #
  # 1000 characters is roughly 250 tokens. bge-small truncates at 512 tokens
  # (~2000 chars), so this leaves comfortable headroom: nothing is silently cut
  # off at embedding time.
  chunk_size: 1000
  # ~15% overlap, so a clause straddling a boundary survives intact in one of
  # the two neighbouring chunks.
  chunk_overlap: 150
  # Trailing fragments shorter than this are dropped — a 12-character chunk
  # produces a vector that matches everything weakly and nothing well.
  min_chunk_chars: 50

  input_filename: pages.jsonl
  output_filename: chunks.jsonl

embed:
  # bge-small-en-v1.5: 384-dim, ~33M params, strong retrieval quality per CPU
  # second. Swap with --model to build a second collection and A/B the two.
  model_name: BAAI/bge-small-en-v1.5
  device: cpu
  batch_size: 32
  # Cosine similarity assumes unit-length vectors. Normalising here lets the
  # index use a plain dot product without changing what the score means.
  normalize: true
  # BGE v1.5 models are trained with an instruction prefix on the QUERY side
  # only — documents are embedded bare. Applying it to both, or to neither,
  # measurably costs recall. Used by rag_chain.py at query time, never here.
  query_prefix: "Represent this sentence for searching relevant passages: "

index:
  # Embedded on-disk Qdrant: in-process, no Docker, persists between runs. The
  # client API is identical to server mode, so Phase 5 changes one line.
  path: qdrant_storage
  # Final collection name is "{prefix}__{model-slug}" so two embedding models
  # can be indexed side by side and compared on the same questions.
  collection_prefix: claimwise
  distance: cosine
  # Phase 1 has no auth, but user_id is written and filtered on from day one:
  # it is a security boundary, and a filter retrofitted later gets forgotten in
  # exactly one code path.
  default_user_id: local-dev
  upsert_batch_size: 128
  input_filename: chunks.jsonl

eval:
  # ~100 golden Q&A pairs (CLAUDE.md Phase 1, task 5).
  target_questions: 100
  # Fraction that are negatives — questions the corpus cannot answer, where the
  # correct behaviour is the refusal sentence. Hand-seeded, not generated.
  negative_fraction: 0.15

  # Sampling weights by policy type. Matches the corpus: 2 health wordings vs
  # 1 home and 1 life, so health carries the eval and the other two are
  # indicative only (D-2).
  type_weights:
    health: 0.5
    home: 0.25
    life: 0.25

  # Quality filters. A generated question that reuses the source chunk's
  # vocabulary is trivially retrievable and inflates hit@5 — it measures string
  # matching, not semantic search. Reject when this fraction of the question's
  # content words also appear in the source chunk.
  max_vocab_overlap: 0.6
  min_question_chars: 25
  # Don't generate from fragments; short chunks rarely contain a full rule.
  min_source_chunk_chars: 300
  # How many extra chunks to try when generations get rejected.
  oversample_factor: 1.6

  # Rough blended rate for the running spend estimate. Provider-specific and
  # approximate — it exists to show the budget draining, not to bill anyone.
  estimated_usd_per_million_tokens: 0.7

  output_filename: golden.jsonl
  review_filename: review.md

  # Retrieve this many chunks once, then slice for each k below. Retrieving 10
  # costs the same as retrieving 5 and lets us see how far down a correct page
  # sits when it misses the top-5 cut.
  retrieval_top_k: 10
  k_values: [1, 3, 5, 10]
  results_dir: evals/results

rag:
  # How many chunks are retrieved and stuffed into the prompt. CLAUDE.md's
  # target architecture is "rerank to top-5", so 5 is the baseline shape; in
  # Phase 1 there is no reranker, so these are the raw top-5 by cosine score.
  top_k: 5
  # The exact sentence the model must emit when the context doesn't contain the
  # answer. A fixed string makes refusals countable without an LLM judge, and
  # becomes a training target for Phase 4's "answer not in context" negatives.
  refusal_text: "That isn't covered in the policy documents you've uploaded."

rerank:
  # Phase 2, technique 1. Off by default so the Phase 1 baseline stays
  # reproducible — the method is one change plus one re-eval, which requires
  # being able to reproduce the "before" at any time.
  enabled: true
  # bge-reranker-base: 278M params, the standard cross-encoder pairing for bge
  # embeddings and CPU-feasible. v2-m3 is stronger but ~2x slower; ms-marco
  # MiniLM is far faster but trained on web QA rather than dense legal prose.
  model_name: BAAI/bge-reranker-base
  device: cpu
  batch_size: 16
  # Swept empirically (D-16). Deeper candidates raise the ceiling but LOWER the
  # result — every extra candidate is another chance to promote a wrong chunk,
  # and the cross-encoder's precision degrades faster than the ceiling rises:
  #
  #   depth 10 -> hit@5 0.776 (97% of its 0.800 ceiling)
  #   depth 20 -> hit@5 0.812 (91% of 0.894)   <- best absolute
  #   depth 30 -> hit@5 0.800 (87% of 0.920)
  #   depth 50 -> hit@5 0.788 (83% of 0.953)
  candidate_depth: 20

hybrid:
  # Phase 2, technique 2. Off by default so each technique is one change plus
  # one re-eval and the previous result stays reproducible.
  enabled: false
  # Candidates each retriever contributes before fusion. Deliberately wider
  # than the reranker's depth: fusion narrows, then the cross-encoder narrows
  # again. Raising pool recall compounds — better candidates in, better
  # reranked output out.
  dense_top_k: 30
  lexical_top_k: 30
  # Reciprocal Rank Fusion constant (Cormack et al. 2009). Fusing by RANK
  # rather than score avoids normalising two incomparable scales: cosine sits
  # in ~0.4-0.9 while BM25 is unbounded and corpus-dependent. 60 is the
  # standard default and robust across corpora.
  rrf_k: 60
  chunks_path: data/processed/chunks.jsonl

generator:
  # The swappable slot. Phases 1-3 point this at a hosted free model; Phase 5
  # points it at the fine-tuned Qwen endpoint. Nothing upstream changes,
  # which is what makes the Phase 4 generator comparison meaningful.
  #
  # NIM, OpenRouter and HF all speak the OpenAI protocol, so switching provider
  # is a base_url and a key — not a new code path.
  #
  # hf     — HF Pro Inference Providers ($2/month). Current default.
  # openrouter — verified working; $5 of credits. Note the configured Qwen model
  #              is a *reasoning* model: it billed 168 output tokens to answer
  #              "OK", so prefer a non-thinking model for bulk eval work.
  # nim    — times out from this machine as of 2026-08-11; unresolved.
  provider: hf

  # Temperature 0: evaluation must be reproducible. A judged metric that moves
  # because of sampling noise cannot be attributed to a pipeline change.
  temperature: 0.0
  max_tokens: 1024
  timeout_seconds: 60
  # Retries cover 429s and transient 5xx with exponential backoff.
  max_retries: 4
  # Client-side throttle. NIM allows ~40 req/min; staying under it turns a
  # rate-limit error into a short wait instead of a failed eval run.
  requests_per_minute: 30

  providers:
    nim:
      base_url: https://integrate.api.nvidia.com/v1
      api_key_env: NVIDIA_API_KEY
      model: meta/llama-3.3-70b-instruct
    openrouter:
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      model: qwen/qwen3.6-35b-a3b
    hf:
      base_url: https://router.huggingface.co/v1
      api_key_env: HF_TOKEN
      model: meta-llama/Llama-3.3-70B-Instruct

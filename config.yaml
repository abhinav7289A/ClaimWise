# ClaimWise configuration — single source of truth for all runtime settings.
# Never hardcode paths, model names, or thresholds in scripts (CLAUDE.md §8).
# Secrets live in .env, never here.

project:
  name: claimwise
  seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  eval_dir: data/eval
  logs_dir: logs

ingest:
  # "text"   = plain reading-order extraction (Phase 1 baseline)
  # "blocks" = positioned blocks sorted top-to-bottom, left-to-right
  # Phase 2 flips this and re-evaluates so the delta is attributable.
  extraction_mode: text

  # Pages with fewer characters than this after cleaning are dropped as
  # blank/cover/divider pages. They add noise to the index and never answer
  # a question. Skipped pages are logged, never dropped silently.
  min_chars_per_page: 40

  # Repeated header/footer removal. Policy PDFs stamp the insurer name, UIN,
  # and "Page 12 of 88" on every page; left in, that boilerplate dominates the
  # embedding of every short chunk and flattens retrieval.
  strip_repeated_lines: true
  # A line must appear on this fraction of pages to count as boilerplate.
  repeated_line_threshold: 0.6
  # Only the first/last N lines of a page are candidates — body text that
  # happens to repeat is left alone.
  repeated_line_edge_lines: 3

  # Rejoin words split across a line break ("hospi-\ntalisation").
  dehyphenate: true
  # NFKC normalisation: collapses ligatures and exotic spaces so that a query
  # embedding and a chunk embedding see the same characters.
  normalize_unicode: true
  # Repair f-ligatures that some font subsets decode into Latin Extended-A
  # letters ("beneĤt" -> "benefit", "ĥoater" -> "floater"). NFKC cannot catch
  # these because the wrong characters are themselves valid Unicode. Both SBI
  # documents in this corpus need it on every page.
  repair_ligatures: true

  output_filename: pages.jsonl

chunk:
  # Recursive splitting: try paragraph, then line, then word, then raw
  # character — so a break lands on a real boundary whenever one exists inside
  # the size budget, instead of slicing mid-sentence.
  #
  # 1000 characters is roughly 250 tokens. bge-small truncates at 512 tokens
  # (~2000 chars), so this leaves comfortable headroom: nothing is silently cut
  # off at embedding time.
  chunk_size: 1000
  # ~15% overlap, so a clause straddling a boundary survives intact in one of
  # the two neighbouring chunks.
  chunk_overlap: 150
  # Trailing fragments shorter than this are dropped — a 12-character chunk
  # produces a vector that matches everything weakly and nothing well.
  min_chunk_chars: 50

  input_filename: pages.jsonl
  output_filename: chunks.jsonl

embed:
  # bge-small-en-v1.5: 384-dim, ~33M params, strong retrieval quality per CPU
  # second. Swap with --model to build a second collection and A/B the two.
  model_name: BAAI/bge-small-en-v1.5
  device: cpu
  batch_size: 32
  # Cosine similarity assumes unit-length vectors. Normalising here lets the
  # index use a plain dot product without changing what the score means.
  normalize: true
  # BGE v1.5 models are trained with an instruction prefix on the QUERY side
  # only — documents are embedded bare. Applying it to both, or to neither,
  # measurably costs recall. Used by rag_chain.py at query time, never here.
  query_prefix: "Represent this sentence for searching relevant passages: "

index:
  # Embedded on-disk Qdrant: in-process, no Docker, persists between runs. The
  # client API is identical to server mode, so Phase 5 changes one line.
  path: qdrant_storage
  # Final collection name is "{prefix}__{model-slug}" so two embedding models
  # can be indexed side by side and compared on the same questions.
  collection_prefix: claimwise
  distance: cosine
  # Phase 1 has no auth, but user_id is written and filtered on from day one:
  # it is a security boundary, and a filter retrofitted later gets forgotten in
  # exactly one code path.
  default_user_id: local-dev
  upsert_batch_size: 128
  input_filename: chunks.jsonl

eval:
  # ~100 golden Q&A pairs (CLAUDE.md Phase 1, task 5).
  target_questions: 100
  # Fraction that are negatives — questions the corpus cannot answer, where the
  # correct behaviour is the refusal sentence. Hand-seeded, not generated.
  negative_fraction: 0.15

  # Sampling weights by policy type. Matches the corpus: 2 health wordings vs
  # 1 home and 1 life, so health carries the eval and the other two are
  # indicative only (D-2).
  type_weights:
    health: 0.5
    home: 0.25
    life: 0.25

  # Quality filters. A generated question that reuses the source chunk's
  # vocabulary is trivially retrievable and inflates hit@5 — it measures string
  # matching, not semantic search. Reject when this fraction of the question's
  # content words also appear in the source chunk.
  max_vocab_overlap: 0.6
  min_question_chars: 25
  # Don't generate from fragments; short chunks rarely contain a full rule.
  min_source_chunk_chars: 300
  # How many extra chunks to try when generations get rejected.
  oversample_factor: 1.6

  # Rough blended rate for the running spend estimate. Provider-specific and
  # approximate — it exists to show the budget draining, not to bill anyone.
  estimated_usd_per_million_tokens: 0.7

  output_filename: golden.jsonl
  review_filename: review.md

  # Retrieve this many chunks once, then slice for each k below. Retrieving 10
  # costs the same as retrieving 5 and lets us see how far down a correct page
  # sits when it misses the top-5 cut.
  retrieval_top_k: 10
  k_values: [1, 3, 5, 10]
  results_dir: evals/results

rag:
  # How many chunks are retrieved and stuffed into the prompt. CLAUDE.md's
  # target architecture is "rerank to top-5", so 5 is the baseline shape; in
  # Phase 1 there is no reranker, so these are the raw top-5 by cosine score.
  top_k: 5
  # The exact sentence the model must emit when the context doesn't contain the
  # answer. A fixed string makes refusals countable without an LLM judge, and
  # becomes a training target for Phase 4's "answer not in context" negatives.
  refusal_text: "That isn't covered in the policy documents you've uploaded."

rerank:
  # Phase 2, technique 1. Off by default so the Phase 1 baseline stays
  # reproducible — the method is one change plus one re-eval, which requires
  # being able to reproduce the "before" at any time.
  enabled: true
  # bge-reranker-base: 278M params, the standard cross-encoder pairing for bge
  # embeddings and CPU-feasible. v2-m3 is stronger but ~2x slower; ms-marco
  # MiniLM is far faster but trained on web QA rather than dense legal prose.
  model_name: BAAI/bge-reranker-base
  device: cpu
  batch_size: 16
  # bge-reranker-base is model_max_length=512 and truncates silently past it.
  # Set explicitly because it is a real design constraint, not a detail: it caps
  # how large a passage this stage can honestly score, which is why parent
  # blocks are expanded AFTER reranking rather than before (see D-18).
  max_length: 512
  # Swept empirically (D-16). Deeper candidates raise the ceiling but LOWER the
  # result — every extra candidate is another chance to promote a wrong chunk,
  # and the cross-encoder's precision degrades faster than the ceiling rises:
  #
  #   depth 10 -> hit@5 0.776 (97% of its 0.800 ceiling)
  #   depth 20 -> hit@5 0.812 (91% of 0.894)   <- best absolute
  #   depth 30 -> hit@5 0.800 (87% of 0.920)
  #   depth 50 -> hit@5 0.788 (83% of 0.953)
  candidate_depth: 20

hybrid:
  # Phase 2, technique 2. Off by default so each technique is one change plus
  # one re-eval and the previous result stays reproducible.
  enabled: false
  # Candidates each retriever contributes before fusion. Deliberately wider
  # than the reranker's depth: fusion narrows, then the cross-encoder narrows
  # again. Raising pool recall compounds — better candidates in, better
  # reranked output out.
  dense_top_k: 30
  lexical_top_k: 30
  # Reciprocal Rank Fusion constant (Cormack et al. 2009). Fusing by RANK
  # rather than score avoids normalising two incomparable scales: cosine sits
  # in ~0.4-0.9 while BM25 is unbounded and corpus-dependent. 60 is the
  # standard default and robust across corpora.
  rrf_k: 60
  chunks_path: data/processed/chunks.jsonl

parent_docs:
  # Phase 2, technique 3. Off by default so the previous result stays
  # reproducible — one change plus one re-eval.
  enabled: false

  # Child 400 / parent 2000. The ratio is the point, not the absolute sizes:
  # children small enough that each is *about* one thing, parents large enough
  # to carry the cross-references insurance wording is built on ("subject to the
  # sub-limits in Table B"). Phase 1's single 1,000-char tier was a compromise
  # that served neither.
  child_size: 400
  child_overlap: 50
  parent_size: 2000
  # Zero on purpose. Overlap stops a clause being cut mid-sentence, which
  # matters for children; parents are returned WHOLE into the prompt, so
  # overlapping them would feed the generator the same sentences twice.
  parent_overlap: 0

  # bge-small truncates past ~2,000 characters. Only children are embedded, so
  # only children can be silently truncated — the build fails loudly if any
  # exceed this.
  embed_budget_chars: 2000

  parents_filename: parents.jsonl
  children_filename: children.jsonl
  parents_path: data/processed/parents.jsonl
  # Children are indexed into their OWN collection so the Phase 1 collection
  # survives untouched and the "before" stays reproducible at any time.
  collection_prefix: claimwise_pd

chunk_policy:
  # Phase 2, technique 5. Chunk each document by its MEASURED page density
  # rather than applying one global size to the corpus.
  #
  # Evidence (D-17, D-18, P-17): three independent measurements showed the same
  # split — the dense life policy gains from small chunks (+9.5 hybrid, +14.3
  # parent-docs) while sparser documents lose from them (home -14.3). Optimal
  # chunk size is a property of the document, not of the corpus.
  #
  # ADOPTED 2026-08-16 (D-19): hit@5 0.8118 -> 0.8706 (+5.9), and +17.7 against
  # the Phase 1 baseline, meeting the phase exit criterion. Life +23.8 while
  # health and home held their previous values exactly.
  enabled: true

  # 8,000 chars/page separates the corpus on a *principle* rather than a name.
  # Measured densities: life 11,639 | home 5,935 | health 5,856 and 2,602.
  # Encoding `life -> parent_child` directly would reproduce the same numbers
  # while memorising the eval set; density is measurable at ingest time, before
  # any question is asked, and generalises to a new dense policy from any
  # insurer. The gap here is wide (5,935 -> 11,639), so the exact threshold is
  # not delicate — but it IS the falsifiable part of the claim, so it lives
  # here where it can be argued with rather than buried in code.
  density_threshold: 8000

  chunks_filename: mixed_chunks.jsonl
  parents_filename: mixed_parents.jsonl
  parents_path: data/processed/mixed_parents.jsonl
  # Its own collection again, so both previous results stay reproducible.
  collection_prefix: claimwise_mx

generator:
  # The swappable slot. Phases 1-3 point this at a hosted free model; Phase 5
  # points it at the fine-tuned Qwen endpoint. Nothing upstream changes,
  # which is what makes the Phase 4 generator comparison meaningful.
  #
  # NIM, OpenRouter and HF all speak the OpenAI protocol, so switching provider
  # is a base_url and a key — not a new code path.
  #
  # nim    — current default as of 2026-08-15. Free tier, ~40 req/min.
  #          Timed out from this machine on 2026-08-11 (P-13, unresolved) — run
  #          `python -m common.generator` to confirm reachability before
  #          committing to a long eval run.
  # hf     — HF Pro Inference Providers. **Balance exhausted 2026-08-15**, which
  #          is what forced this switch. Produced the Phase 1 baseline, so a
  #          like-for-like comparison against those numbers is no longer
  #          possible; see the note in METRICS.md before comparing across it.
  # openrouter — verified working; $5 of credits. Fallback. Note the configured
  #          Qwen model is a *reasoning* model: it billed 168 output tokens to
  #          answer "OK", so swap in a non-thinking model for bulk eval work.
  provider: nim

  # Temperature 0: evaluation must be reproducible. A judged metric that moves
  # because of sampling noise cannot be attributed to a pipeline change.
  temperature: 0.0
  max_tokens: 1024
  timeout_seconds: 60
  # Retries cover 429s and transient 5xx with exponential backoff.
  max_retries: 4
  # Client-side throttle. NIM allows ~40 req/min; staying under it turns a
  # rate-limit error into a short wait instead of a failed eval run.
  requests_per_minute: 30

  # Per-provider token prices, in USD per million. Previously there was one
  # blended guess (eval.estimated_usd_per_million_tokens: 0.7) shared by every
  # provider, which overestimated DeepSeek by ~10x. That is tolerable when the
  # number only shows a budget draining; it is not tolerable when the total
  # project budget is $2-3 and a single estimate decides whether a run happens.
  # Free tiers are priced 0.0 so a paid run stands out in the ledger.
  providers:
    nim:
      base_url: https://integrate.api.nvidia.com/v1
      api_key_env: NVIDIA_API_KEY
      model: google/gemma-4-31b-it
      # Free tier. Costs time and rate limits, not money.
      usd_per_million_input: 0.0
      usd_per_million_output: 0.0
    openrouter:
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      # PAID, and the only paid path in the project. ~$2 lifetime budget, so
      # every run through it must print an estimate first. 1M-token context is
      # why it is the only option for the full-context experiment: the corpus is
      # ~124K tokens and NIM timed out on it.
      model: deepseek/deepseek-v4-flash-0731
      usd_per_million_input: 0.0675
      usd_per_million_output: 0.135
    hf:
      base_url: https://router.huggingface.co/v1
      api_key_env: HF_TOKEN
      # Balance exhausted 2026-08-15. Kept for provenance: it produced the
      # Phase 1 baseline.
      model: meta-llama/Llama-3.3-70B-Instruct
      usd_per_million_input: 0.0
      usd_per_million_output: 0.0

judge:
  # The RAGAS judge. Configured separately from `generator` on purpose: the
  # thing being *measured* and the thing *doing the measuring* must be
  # independently swappable, or a provider switch silently changes both sides
  # of a comparison at once. Phase 4 benchmarks several generators against one
  # fixed judge — that only works if they are separate settings.
  #
  # Empty means "reuse generator.provider". Set it when the two differ.
  #
  # Pinned to a DIFFERENT model from the generator on purpose. RAGAS
  # faithfulness asks a model to judge whether an answer is grounded in its
  # context; if the judge is the model that wrote the answer, it grades its own
  # reasoning and scores itself generously. An independent judge is the cheapest
  # correction available.
  #
  # REJECTED 2026-08-15: openai/gpt-oss-120b. The reasoning that should have
  # helped claim decomposition broke the metric instead — it wraps replies in
  # thinking tokens, RAGAS cannot parse a verdict out of them, and faithfulness
  # came back None with 4/4 items failed on a 5-item smoke. A structured-output
  # consumer needs a model that emits structure, not one that reasons well.
  #
  # ALSO REJECTED 2026-08-16: nim/google/gemma-4-31b-it. It generates fine, but
  # as a RAGAS judge the NIM endpoint returned HTTP 500 on every single call —
  # server errors, not rate limiting. With retries the run projected to 7h51m
  # for 158 jobs. Generation-capable does not imply judge-capable on a free tier.
  #
  # Now on OpenRouter, which means the judge and the generator are the same
  # model when the generator is also OpenRouter. That is a real compromise, not
  # a free choice: a model judging its own output scores itself generously, so
  # faithfulness must be read as an UPPER BOUND. Recorded rather than hidden.
  # The fix is a second cheap OpenRouter model of a different family — set
  # `model` below and independence is restored without touching code.
  provider: openrouter
  model: ""

  # Throttling, and why it needs its own numbers.
  #
  # RAGAS does not use `common/generator.py`. It builds its own LangChain
  # client, so the sliding-window throttle there does not apply to judge calls
  # — the one place in this project where an LLM call escapes the swappable
  # interface. These two settings are the replacement, applied directly to the
  # LangChain client and to RAGAS's executor.
  #
  # RAGAS defaults to max_workers=16, meaning 16 concurrent judge calls. NIM
  # allows ~40 req/min, so the default produces an immediate 429 storm. A
  # 100-question run is ~156 judge calls; at 30/min that is ~5 minutes of
  # judging, which is the correct trade against a run that fails at question 20.
  requests_per_minute: 30
  max_workers: 4
  timeout_seconds: 180
  # Lowered from 6. Retries are worth paying for on 429s and transient blips;
  # they are pure waste against a hard 500, which is what NIM returned on every
  # call. Six attempts turned each failure into ~30s of backoff and projected a
  # 158-job run to nearly eight hours.
  max_retries: 3

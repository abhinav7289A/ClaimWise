[project]
name = "claimwise"
version = "0.1.0"
description = "Agentic health insurance policy & claims assistant"
requires-python = ">=3.11,<3.12"

# Phase 1 file 1-2 dependencies only. Retrieval deps (sentence-transformers,
# qdrant-client, langchain) land at embed_index.py so we don't download ~2GB of
# torch before a single PDF has been parsed.
dependencies = [
    # PyMuPDF: fastest pure-Python PDF text extractor with per-page access and
    # block coordinates. pdfplumber is more accurate on tables but ~10x slower;
    # pypdf loses layout entirely. CLAUDE.md fixes this choice.
    "pymupdf>=1.24",
    # PyYAML: config.yaml parsing. Standard, no alternative worth the argument.
    "pyyaml>=6.0",
    # tqdm: progress bars for multi-document ingestion runs.
    "tqdm>=4.66",
    # langchain-text-splitters: the standalone splitter package (not full
    # LangChain). Its RecursiveCharacterTextSplitter is the reference
    # implementation the ecosystem benchmarks against, so our baseline stays
    # comparable to published numbers. Hand-rolling it is ~40 lines but invites
    # subtle off-by-one bugs that would silently contaminate every later metric.
    "langchain-text-splitters>=0.3",
    # sentence-transformers: the reference runtime for BGE models. It applies
    # the correct pooling and normalisation automatically; driving raw
    # transformers means hand-rolling CLS pooling, which fails silently by
    # producing worse vectors rather than an error. Qdrant's fastembed is a far
    # lighter ONNX alternative, but Phase 2's cross-encoder reranker needs
    # sentence-transformers anyway, so torch arrives one phase later at best.
    "sentence-transformers>=3.0",
    # qdrant-client: same API for embedded on-disk and server mode, so the
    # Phase 5 move to a hosted instance is a config change, not a rewrite.
    "qdrant-client>=1.10",
    # openai: used as a generic client, not as a provider. NVIDIA NIM,
    # OpenRouter and HF Inference Providers all speak the OpenAI protocol, so
    # one client plus a base_url covers every generator we need. Hand-rolling
    # httpx calls would mean reimplementing retries, timeouts and error types.
    "openai>=1.40",
    # python-dotenv: loads .env so API keys never live in config.yaml or code.
    "python-dotenv>=1.0",
]

[tool.uv]
# Virtual project: uv manages .venv and dependencies but does not build/install
# claimwise itself. Scripts run from the repo root via `python -m <package>.<mod>`,
# so new phase packages need no pyproject edit to become importable.
package = false
